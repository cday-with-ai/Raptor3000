<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Do not offer to machine-translate this page.

         Carson caught Brave offering "German | English" over the chat
         window. The page is not mislabelled — every document here sets
         lang correctly, and the app localises its own chrome into twelve
         languages already (Options -> Language, or the row on the login
         screen). This is Chromium's content detector guessing from the
         FICS console, which is timestamps, handles, commands and SAN
         rather than prose.

         Suppressed rather than corrected because translating that text
         would break it: "Nf3" is not a German word, `follow /b` is not a
         sentence, and a translated command is a command that no longer
         works. The language a user actually wants is the one the app
         asks them for. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/raptor3000.png" />
    <title>Raptor3000</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
